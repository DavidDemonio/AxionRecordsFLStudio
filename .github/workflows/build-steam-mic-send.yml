name: Build SteamMic Send

on:
  push:
    branches:
      - steam-mic-vst-build
    paths:
      - 'SteamMicSend/**'
      - '.github/workflows/build-steam-mic-send.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VST3
        shell: pwsh
        run: |
          cmake -S SteamMicSend -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target SteamMicSend --parallel 2

      - name: Collect VST3 bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Filter "SteamMicSend.vst3" -Recurse | Select-Object -First 1
          if (-not $plugin) {
            Get-ChildItem -Path build -Recurse | Select-Object -ExpandProperty FullName
            throw "SteamMicSend.vst3 bundle was not found"
          }
          New-Item -ItemType Directory -Force -Path SteamMicSend/package | Out-Null
          Copy-Item -Recurse -Force $plugin.FullName SteamMicSend/package/SteamMicSend.vst3
          Write-Host "VST3 bundle: $($plugin.FullName)"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          Push-Location SteamMicSend
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Pop-Location
          Get-FileHash SteamMicSend/dist/SteamMicSend-Setup-x64.exe -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SteamMicSend-Windows-x64
          path: |
            SteamMicSend/dist/SteamMicSend-Setup-x64.exe
            SteamMicSend/package/SteamMicSend.vst3
          if-no-files-found: error
          compression-level: 9
